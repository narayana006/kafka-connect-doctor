[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-connect-doctor"
version = "0.1.0"
description = "Diagnose Kafka Connect connectors from REST API status: failed tasks, classified errors, and a safe restart plan."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
keywords = ["kafka", "kafka-connect", "sre", "troubleshooting", "operations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kafka-connect-doctor = "kafka_connect_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/kafka-connect-doctor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
